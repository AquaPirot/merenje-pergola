<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERGOLA MEASURE v1.8</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f2ff;
            --neon-orange: #ffaa00;
            --text-main: #e4e4e7;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-header: 'Bebas Neue', cursive;
            --font-data: 'IBM Plex Sans', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg); color: var(--text-main); font-family: var(--font-data);
            margin: 0; padding: 15px; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 100%, #1e1b4b 0%, #09090b 100%);
            background-attachment: fixed;
        }

        h1, h2, h3 { font-family: var(--font-header); letter-spacing: 1px; margin: 0; }

        /* HEADER & STATS */
        .header { margin-bottom: 15px; }
        .stats-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-box {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 12px; text-align: center; backdrop-filter: blur(5px);
        }
        .stat-val { font-size: 1.4rem; font-weight: bold; display: block; font-family: var(--font-header); }
        .stat-label { font-size: 0.6rem; opacity: 0.6; text-transform: uppercase; }

        .search-box {
            width: 100%; background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 20px; font-size: 1rem;
        }

        /* PROJECT CARDS */
        .measure-list { display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .measure-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px; position: relative; backdrop-filter: blur(10px);
        }

        .status-badge {
            position: absolute; top: 15px; right: 15px; font-size: 0.7rem; 
            padding: 4px 8px; border-radius: 5px; font-weight: bold; text-transform: uppercase;
        }
        .status-todo { background: rgba(255, 170, 0, 0.1); color: var(--neon-orange); border: 1px solid var(--neon-orange); }
        .status-done { background: rgba(0, 242, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }

        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .action-btn {
            padding: 12px; border-radius: 10px; text-decoration: none; text-align: center;
            font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-call { background: #16a34a; color: #fff; }
        .btn-map { background: var(--neon-purple); color: #fff; }

        /* MODAL */
        .modal {
            display: none; position: fixed; inset: 0; background: #000;
            z-index: 1000; padding: 15px; overflow-y: auto;
        }
        .section-title { color: var(--neon-purple); border-bottom: 1px solid var(--neon-purple); margin: 25px 0 10px 0; padding-bottom: 5px; }
        .form-group { margin-bottom: 10px; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 3px; }
        input, select, textarea {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 8px; color: #fff; width: 100%; font-family: var(--font-data);
        }

        .item-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(188, 19, 254, 0.3);
            padding: 15px; border-radius: 12px; margin-bottom: 20px; position: relative;
        }
        .remove-item { position: absolute; top: 10px; right: 10px; color: #ff003c; font-size: 0.7rem; font-weight: bold; }
        .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn {
            padding: 14px; border-radius: 10px; border: none; font-family: var(--font-header);
            font-size: 1.2rem; width: 100%; cursor: pointer; text-align: center; display: block;
        }
        .btn-save { background: var(--neon-purple); color: #fff; margin-top: 30px; }

        .fab {
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
            background: var(--neon-purple); border-radius: 50%; border: none; font-size: 35px;
            color: white; box-shadow: 0 0 20px rgba(188, 19, 254, 0.5); z-index: 99;
        }

        #tech-sheet { position: fixed; left: -9999px; width: 850px; background: #fff; color: #000; padding: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="font-size: 2rem;">PERGOLA <span style="color: var(--neon-purple);">MEASURE</span></h1>
        <div style="font-size: 0.75rem; opacity: 0.5; letter-spacing: 2px;">LOGISTIKA v1.8</div>
    </div>

    <!-- STATISTIKA -->
    <div class="stats-container">
        <div class="stat-box">
            <span class="stat-val" id="countTotal">0</span>
            <span class="stat-label">Ukupno</span>
        </div>
        <div class="stat-box" style="border-color: var(--neon-orange);">
            <span class="stat-val" id="countTodo" style="color: var(--neon-orange);">0</span>
            <span class="stat-label">Za merenje</span>
        </div>
        <div class="stat-box" style="border-color: var(--neon-cyan);">
            <span class="stat-val" id="countDone" style="color: var(--neon-cyan);">0</span>
            <span class="stat-label">Izmereno</span>
        </div>
    </div>

    <input type="text" class="search-box" id="search" placeholder="Pretraži klijente ili lokaciju..." oninput="render()">

    <div class="measure-list" id="measureList"></div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- MODAL -->
    <div id="measureModal" class="modal">
        <h2 style="color: var(--neon-purple);">KLIJENT & LOKACIJA</h2>
        <input type="hidden" id="editId">
        <div class="form-group"><label>Ime Klijenta</label><input type="text" id="client"></div>
        <div class="fields-grid">
            <div class="form-group"><label>📍 Lokacija / Adresa</label><input type="text" id="location"></div>
            <div class="form-group"><label>📞 Telefon</label><input type="tel" id="phone"></div>
        </div>
        <h2 class="section-title">SPECIFIKACIJA</h2>
        <div id="itemsContainer"></div>
        <button class="btn" style="background:transparent; border:1px solid var(--neon-purple); color:var(--neon-purple); margin:10px 0; font-size:1rem;" onclick="addItem()">+ DODAJ ELEMENT</button>
        <h2 class="section-title">FINANSIJE</h2>
        <div class="fields-grid">
            <div class="form-group"><label>Cena (€)</label><input type="number" id="totalPrice"></div>
            <div class="form-group"><label>Avans (€)</label><input type="number" id="deposit"></div>
        </div>
        <div class="form-group"><label>Napomena</label><textarea id="notes" rows="3"></textarea></div>
        <button class="btn btn-save" onclick="saveProject()">SAČUVAJ ZAPISNIK</button>
        <button class="btn" style="background:transparent; color:grey; margin-top:10px; font-size:1rem;" onclick="closeModal()">ODUSTANI</button>
    </div>

    <script>
        // MIGRACIJA I LOADING
        const STORAGE_KEY = 'pergola_master_measure';
        const oldKeys = ['pergola_measure_v1.7', 'pergola_measure_v1.6', 'pergola_measure_v1', 'pergola_merenja_data'];
        
        let rawData = localStorage.getItem(STORAGE_KEY);
        if(!rawData) {
            for(let key of oldKeys) {
                let found = localStorage.getItem(key);
                if(found) { rawData = found; break; }
            }
        }
        let projects = JSON.parse(rawData || "[]");

        function openModal(id = null) {
            const modal = document.getElementById('measureModal');
            document.getElementById('itemsContainer').innerHTML = '';
            if(id) {
                const p = projects.find(x => x.id === id);
                document.getElementById('editId').value = p.id;
                document.getElementById('client').value = p.client;
                document.getElementById('location').value = p.location;
                document.getElementById('phone').value = p.phone;
                document.getElementById('totalPrice').value = p.totalPrice;
                document.getElementById('deposit').value = p.deposit;
                document.getElementById('notes').value = p.notes;
                p.items.forEach(item => addItem(item));
            } else {
                document.getElementById('editId').value = "";
                document.querySelectorAll('.modal input, .modal textarea').forEach(i => i.value = "");
                addItem(); 
            }
            modal.style.display = 'block';
        }

        function addItem(data = {}) {
            const container = document.getElementById('itemsContainer');
            const div = document.createElement('div');
            div.className = 'item-box';
            div.innerHTML = `
                <span class="remove-item" onclick="this.parentElement.remove()">OBRIŠI X</span>
                <select class="i-type"><option value="Pergola" ${data.type==='Pergola'?'selected':''}>Pergola</option><option value="Staklo" ${data.type==='Staklo'?'selected':''}>Staklo</option></select>
                <div class="fields-grid" style="margin-top:10px;">
                    <div class="form-group"><label>Širina (cm)</label><input type="number" class="i-w" value="${data.w||''}"></div>
                    <div class="form-group"><label>Projekcija/Visina (cm)</label><input type="number" class="i-h" value="${data.h||''}"></div>
                </div>
                <input type="hidden" class="i-hr" value="${data.hr||''}">
                <input type="hidden" class="i-hf" value="${data.hf||''}">
                <input type="hidden" class="i-motor" value="${data.motor||'Levo'}">
                <input type="hidden" class="i-ral" value="${data.ral||''}">
                <input type="hidden" class="i-fabric" value="${data.fabric||''}">
                <input type="hidden" class="i-light" value="${data.light||'Toplo'}">
            `;
            container.appendChild(div);
        }

        function closeModal() { document.getElementById('measureModal').style.display = 'none'; }

        function saveProject() {
            const id = document.getElementById('editId').value;
            const itemBoxes = document.querySelectorAll('.item-box');
            let items = [];
            itemBoxes.forEach(box => {
                items.push({
                    type: box.querySelector('.i-type').value,
                    w: box.querySelector('.i-w').value,
                    h: box.querySelector('.i-h').value,
                    hr: box.querySelector('.i-hr').value || "",
                    hf: box.querySelector('.i-hf').value || "",
                    motor: box.querySelector('.i-motor').value || "Levo",
                    ral: box.querySelector('.i-ral').value || "",
                    fabric: box.querySelector('.i-fabric').value || "",
                    light: box.querySelector('.i-light').value || "Toplo"
                });
            });

            const pData = {
                id: id ? parseInt(id) : Date.now(),
                client: document.getElementById('client').value,
                location: document.getElementById('location').value,
                phone: document.getElementById('phone').value,
                totalPrice: document.getElementById('totalPrice').value,
                deposit: document.getElementById('deposit').value,
                notes: document.getElementById('notes').value,
                items: items
            };

            if(id) {
                const idx = projects.findIndex(x => x.id == id);
                projects[idx] = pData;
            } else {
                projects.push(pData);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
            render();
            closeModal();
        }

        function render() {
            const list = document.getElementById('measureList');
            const search = document.getElementById('search').value.toLowerCase();
            list.innerHTML = '';

            let countTodo = 0;
            let countDone = 0;

            const filtered = projects.filter(p => 
                p.client.toLowerCase().includes(search) || 
                p.location.toLowerCase().includes(search)
            );

            filtered.reverse().forEach(p => {
                const isDone = p.items && p.items.some(i => i.w > 0);
                if(isDone) countDone++; else countTodo++;
                
                const card = document.createElement('div');
                card.className = 'measure-card';
                card.innerHTML = `
                    <div class="status-badge ${isDone ? 'status-done' : 'status-todo'}">
                        ${isDone ? 'Izmereno' : 'Za merenje'}
                    </div>
                    <div style="font-size:1.6rem; color:#fff; font-family:'Bebas Neue'; padding-right:80px;">${p.client}</div>
                    <div style="font-size:0.85rem; opacity:0.7; margin-bottom:5px;">📍 ${p.location}</div>
                    
                    <div class="quick-actions">
                        <a href="tel:${p.phone}" class="action-btn btn-call">📞 POZOVI</a>
                        <a href="https://www.google.com/maps/search/${encodeURIComponent(p.location)}" target="_blank" class="action-btn btn-map">🗺️ MAPA</a>
                    </div>

                    <div style="margin-top:10px; font-size:0.8rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px; opacity:0.8;">
                        ${p.items.map(i => `• ${i.type}: ${i.w || '?'} x ${i.h || '?'}`).join('<br>')}
                    </div>

                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button onclick="openModal(${p.id})" class="btn" style="background:rgba(255,255,255,0.05); color:#fff; font-size:0.8rem; padding:10px;">DETALJI / IZMENI</button>
                        <button onclick="deleteProject(${p.id})" class="btn" style="background:none; color:rgba(255,0,0,0.3); font-size:0.8rem; width:auto; border:none;">OBRIŠI</button>
                    </div>
                `;
                list.appendChild(card);
            });

            // AŽURIRAJ STATISTIKU
            document.getElementById('countTotal').innerText = projects.length;
            document.getElementById('countTodo').innerText = projects.filter(p => !(p.items && p.items.some(i => i.w > 0))).length;
            document.getElementById('countDone').innerText = projects.filter(p => (p.items && p.items.some(i => i.w > 0))).length;
        }

        function deleteProject(id) { if(confirm("Obriši zapisnik?")) { projects = projects.filter(x => x.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); render(); } }

        render();
    </script>
</body>
</html>
