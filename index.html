<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERGOLA MEASURE v1.6</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --text-main: #e4e4e7;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-header: 'Bebas Neue', cursive;
            --font-data: 'IBM Plex Sans', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg); color: var(--text-main); font-family: var(--font-data);
            margin: 0; padding: 15px; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 100%, #1e1b4b 0%, #09090b 100%);
            background-attachment: fixed;
        }

        h1, h2, h3 { font-family: var(--font-header); letter-spacing: 1px; }

        .search-box {
            width: 100%; background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 10px; color: white; margin-bottom: 20px;
        }

        .measure-list { display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .measure-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px; position: relative; backdrop-filter: blur(10px);
        }

        /* MODAL */
        .modal {
            display: none; position: fixed; inset: 0; background: #000;
            z-index: 1000; padding: 15px; overflow-y: auto;
        }
        .section-title { color: var(--neon-purple); border-bottom: 1px solid var(--neon-purple); margin: 25px 0 10px 0; padding-bottom: 5px; }
        
        .form-group { margin-bottom: 10px; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 3px; }
        input, select, textarea {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 8px; color: #fff; width: 100%; font-family: var(--font-data);
        }

        /* STAVKE KONTEJNER */
        .item-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(188, 19, 254, 0.3);
            padding: 15px; border-radius: 12px; margin-bottom: 20px; position: relative;
        }
        .remove-item { position: absolute; top: 10px; right: 10px; color: #ff003c; font-size: 0.7rem; font-weight: bold; }
        
        .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-row { grid-column: span 2; }
        .m2-display { color: var(--neon-cyan); font-size: 0.8rem; font-weight: bold; margin-top: 5px; text-align: right; }

        .btn {
            padding: 12px; border-radius: 8px; border: none; font-family: var(--font-header);
            font-size: 1.1rem; width: 100%; cursor: pointer; text-align: center; display: block;
        }
        .btn-add { background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); margin: 15px 0; }
        .btn-save { background: var(--neon-purple); color: #fff; margin-top: 30px; font-size: 1.5rem; box-shadow: 0 0 20px rgba(188, 19, 254, 0.4); }

        .fab {
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
            background: var(--neon-purple); border-radius: 50%; border: none; font-size: 35px;
            color: white; box-shadow: 0 0 20px rgba(188, 19, 254, 0.5); z-index: 99;
        }

        /* TECH SHEET STYLE */
        #tech-sheet {
            position: fixed; left: -9999px; width: 850px; background: #fff; color: #000; padding: 40px; font-family: sans-serif;
        }
        .s-item-header { background: #000; color: #fff; padding: 10px; margin-top: 20px; font-family: 'Bebas Neue'; }
        .s-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .s-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .s-val { font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 style="font-size: 2.2rem; margin:0;">PERGOLA <span style="color: var(--neon-purple);">MEASURE</span></h1>
        <div style="font-size: 0.8rem; opacity: 0.5; letter-spacing: 2px;">TEHNIČKA SPECIFIKACIJA v1.6</div>
    </header>

    <input type="text" class="search-box" id="search" placeholder="Pretraži klijente..." oninput="render()">

    <div class="measure-list" id="measureList"></div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- MODAL -->
    <div id="measureModal" class="modal">
        <h2 style="color: var(--neon-purple);">KLIJENT & LOKACIJA</h2>
        <input type="hidden" id="editId">
        
        <div class="form-group"><label>Ime Klijenta</label><input type="text" id="client"></div>
        <div class="fields-grid">
            <div class="form-group"><label>📍 Lokacija</label><input type="text" id="location"></div>
            <div class="form-group"><label>📞 Telefon</label><input type="tel" id="phone"></div>
        </div>

        <h2 class="section-title">SPECIFIKACIJA ELEMENATA</h2>
        <div id="itemsContainer"></div>
        <button class="btn btn-add" onclick="addItem()">+ DODAJ PERGOLU ILI STAKLO</button>

        <h2 class="section-title">FINANSIJE I NAPOMENA</h2>
        <div class="fields-grid">
            <div class="form-group"><label>Ukupna Cena (€)</label><input type="number" id="totalPrice"></div>
            <div class="form-group"><label>Avans (€)</label><input type="number" id="deposit"></div>
        </div>
        <div class="form-group"><label>Glavna Napomena</label><textarea id="notes" rows="3"></textarea></div>

        <button class="btn btn-save" onclick="saveProject()">SAČUVAJ ZAPISNIK</button>
        <button class="btn" style="background:transparent; color:grey; margin-top:10px;" onclick="closeModal()">ODUSTANI</button>
    </div>

    <!-- TECH SHEET (Hidden) -->
    <div id="tech-sheet">
        <div style="border-bottom: 5px solid #000; padding-bottom: 10px;">
            <h1 id="s-client" style="font-size: 3rem; margin:0;"></h1>
            <p id="s-loc" style="font-size: 1.3rem; margin:5px 0; font-weight: bold;"></p>
            <p id="s-date" style="opacity: 0.6;"></p>
        </div>
        <div id="s-items"></div>
        <div style="margin-top: 30px; border: 2px solid #000; padding: 20px;">
            <h2 style="margin:0 0 10px 0;">FINANSIJSKI PREGLED:</h2>
            <p id="s-price" style="font-size: 1.8rem; font-weight: bold; margin:0;"></p>
            <p id="s-notes" style="margin-top:10px; font-style: italic;"></p>
        </div>
    </div>

    <script>
        let projects = JSON.parse(localStorage.getItem('pergola_measure_v1.6')) || [];
        const PHASES = ['Merenje', 'Proizvodnja', 'Spreman', 'Montaža'];

        function openModal(id = null) {
            const modal = document.getElementById('measureModal');
            document.getElementById('itemsContainer').innerHTML = '';
            
            if(id) {
                const p = projects.find(x => x.id === id);
                document.getElementById('editId').value = p.id;
                document.getElementById('client').value = p.client;
                document.getElementById('location').value = p.location;
                document.getElementById('phone').value = p.phone;
                document.getElementById('totalPrice').value = p.totalPrice;
                document.getElementById('deposit').value = p.deposit;
                document.getElementById('notes').value = p.notes;
                p.items.forEach(item => addItem(item));
            } else {
                document.getElementById('editId').value = "";
                document.querySelectorAll('.modal input, .modal textarea').forEach(i => i.value = "");
                addItem(); 
            }
            modal.style.display = 'block';
        }

        function addItem(data = {}) {
            const container = document.getElementById('itemsContainer');
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item-box';
            
            itemDiv.innerHTML = `
                <span class="remove-item" onclick="this.parentElement.remove()">UKLONI X</span>
                <div class="form-group">
                    <label>Tip elementa</label>
                    <select class="i-type" onchange="toggleFields(this)">
                        <option value="Pergola" ${data.type === 'Pergola' ? 'selected' : ''}>Pergola</option>
                        <option value="Staklo" ${data.type === 'Staklo' ? 'selected' : ''}>Stakleni Sistem</option>
                    </select>
                </div>
                
                <div class="fields-grid">
                    <div class="form-group"><label>Širina (cm)</label><input type="number" class="i-w" value="${data.w || ''}" oninput="calcM2(this)"></div>
                    <div class="form-group"><label class="label-h">${data.type === 'Staklo' ? 'Visina' : 'Projekcija'} (cm)</label><input type="number" class="i-h" value="${data.h || ''}" oninput="calcM2(this)"></div>
                </div>

                <div class="pergola-details" style="display: ${data.type === 'Staklo' ? 'none' : 'block'}">
                    <div class="fields-grid">
                        <div class="form-group"><label>Visina Zadnja (cm)</label><input type="number" class="i-hr" value="${data.hr || ''}"></div>
                        <div class="form-group"><label>Visina Prednja (cm)</label><input type="number" class="i-hf" value="${data.hf || ''}"></div>
                        <div class="form-group"><label>Motor Strana</label><select class="i-motor"><option ${data.motor==='Levo'?'selected':''}>Levo</option><option ${data.motor==='Desno'?'selected':''}>Desno</option></select></div>
                        <div class="form-group"><label>RAL Aluminijuma</label><input type="text" class="i-ral" value="${data.ral || ''}" placeholder="npr. 7016"></div>
                        <div class="form-group"><label>Boja Platna</label><input type="text" class="i-fabric" value="${data.fabric || ''}" placeholder="npr. T305"></div>
                        <div class="form-group"><label>Boja Svetla</label><select class="i-light"><option ${data.light==='Toplo'?'selected':''}>Toplo</option><option ${data.light==='Hladno'?'selected':''}>Hladno</option><option ${data.light==='RGB'?'selected':''}>RGB</option></select></div>
                    </div>
                </div>

                <div class="m2-display">Površina: <span class="m2-val">${data.m2 || '0'}</span> m²</div>
            `;
            container.appendChild(itemDiv);
        }

        function toggleFields(select) {
            const box = select.closest('.item-box');
            const isGlass = select.value === 'Staklo';
            box.querySelector('.pergola-details').style.display = isGlass ? 'none' : 'block';
            box.querySelector('.label-h').innerText = isGlass ? 'Visina (cm)' : 'Projekcija (cm)';
        }

        function calcM2(input) {
            const box = input.closest('.item-box');
            const w = box.querySelector('.i-w').value;
            const h = box.querySelector('.i-h').value;
            const display = box.querySelector('.m2-val');
            if(w && h) display.innerText = (w * h / 10000).toFixed(2);
        }

        function closeModal() { document.getElementById('measureModal').style.display = 'none'; }

        function saveProject() {
            const id = document.getElementById('editId').value;
            const itemBoxes = document.querySelectorAll('.item-box');
            let items = [];
            
            itemBoxes.forEach(box => {
                items.push({
                    type: box.querySelector('.i-type').value,
                    w: box.querySelector('.i-w').value,
                    h: box.querySelector('.i-h').value,
                    m2: box.querySelector('.m2-val').innerText,
                    hr: box.querySelector('.i-hr').value,
                    hf: box.querySelector('.i-hf').value,
                    motor: box.querySelector('.i-motor').value,
                    ral: box.querySelector('.i-ral').value,
                    fabric: box.querySelector('.i-fabric').value,
                    light: box.querySelector('.i-light').value
                });
            });

            const pData = {
                id: id ? parseInt(id) : Date.now(),
                client: document.getElementById('client').value,
                location: document.getElementById('location').value,
                phone: document.getElementById('phone').value,
                totalPrice: document.getElementById('totalPrice').value,
                deposit: document.getElementById('deposit').value,
                notes: document.getElementById('notes').value,
                items: items
            };

            if(id) {
                const idx = projects.findIndex(x => x.id == id);
                projects[idx] = pData;
            } else {
                projects.push(pData);
            }

            localStorage.setItem('pergola_measure_v1.6', JSON.stringify(projects));
            render();
            closeModal();
        }

        function render() {
            const list = document.getElementById('measureList');
            const search = document.getElementById('search').value.toLowerCase();
            list.innerHTML = '';

            projects.filter(p => p.client.toLowerCase().includes(search)).reverse().forEach(p => {
                const card = document.createElement('div');
                card.className = 'measure-card';
                card.innerHTML = `
                    <div style="font-size:1.6rem; color:#fff; font-family:'Bebas Neue';">${p.client}</div>
                    <div style="font-size:0.85rem; opacity:0.7;">📍 ${p.location}</div>
                    <div style="color:var(--neon-green); font-weight:bold; margin-top:5px;">Cena: ${p.totalPrice || 0} €</div>
                    <div style="margin-top:10px; font-size:0.8rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
                        ${p.items.map(i => `• ${i.type}: ${i.w}x${i.h} cm (${i.m2} m²)`).join('<br>')}
                    </div>
                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button onclick="openModal(${p.id})" class="btn" style="background:rgba(255,255,255,0.1); color:#fff; font-size:0.8rem;">IZMENI</button>
                        <button onclick="exportImage(${p.id})" class="btn" style="background:var(--neon-purple); color:#fff; font-size:0.8rem;">📸 TEHNIČKI LIST</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function exportImage(id) {
            const p = projects.find(x => x.id === id);
            document.getElementById('s-client').innerText = p.client.toUpperCase();
            document.getElementById('s-loc').innerText = "LOKACIJA: " + p.location;
            document.getElementById('s-date').innerText = "DATUM MERENJA: " + new Date().toLocaleDateString('sr-RS');
            document.getElementById('s-price').innerText = `UKUPNO: ${p.totalPrice} € | AVANS: ${p.deposit} €`;
            document.getElementById('s-notes').innerText = "NAPOMENE: " + p.notes;
            
            const container = document.getElementById('s-items');
            container.innerHTML = '';
            
            p.items.forEach((item, idx) => {
                const isPergola = item.type === 'Pergola';
                container.innerHTML += `
                    <div class="s-item-header">STAVKA ${idx+1}: ${item.type.toUpperCase()}</div>
                    <div class="s-grid">
                        <div><div class="s-label">Širina</div><div class="s-val">${item.w} cm</div></div>
                        <div><div class="s-label">${isPergola ? 'Projekcija' : 'Visina'}</div><div class="s-val">${item.h} cm</div></div>
                        <div><div class="s-label">Površina</div><div class="s-val">${item.m2} m²</div></div>
                    </div>
                    ${isPergola ? `
                    <div class="s-grid">
                        <div><div class="s-label">V. Zadnja</div><div class="s-val">${item.hr} cm</div></div>
                        <div><div class="s-label">V. Prednja</div><div class="s-val">${item.hf} cm</div></div>
                        <div><div class="s-label">Motor</div><div class="s-val">${item.motor}</div></div>
                        <div><div class="s-label">RAL</div><div class="s-val">${item.ral}</div></div>
                    </div>
                    <div class="s-grid">
                        <div><div class="s-label">Platno</div><div class="s-val">${item.fabric}</div></div>
                        <div><div class="s-label">Svetlo</div><div class="s-val">${item.light}</div></div>
                    </div>
                    ` : ''}
                `;
            });

            const canvas = await html2canvas(document.getElementById('tech-sheet'));
            const link = document.createElement('a');
            link.download = `Tehnicki_List_${p.client}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        render();
    </script>
</body>
</html>
