<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERGOLA MEASURE v1.9</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg: #09090b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f2ff;
            --neon-orange: #ffaa00;
            --neon-green: #39ff14;
            --text-main: #e4e4e7;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-header: 'Bebas Neue', cursive;
            --font-data: 'IBM Plex Sans', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg); color: var(--text-main); font-family: var(--font-data);
            margin: 0; padding: 15px; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 100%, #1e1b4b 0%, #09090b 100%);
            background-attachment: fixed;
        }

        h1, h2, h3 { font-family: var(--font-header); letter-spacing: 1px; margin: 0; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 12px; text-align: center;
        }
        .stat-val { font-size: 1.5rem; display: block; font-family: var(--font-header); }
        .stat-lbl { font-size: 0.6rem; opacity: 0.6; text-transform: uppercase; }

        .search-box {
            width: 100%; background: var(--card-bg); border: 1px solid var(--glass-border);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 15px; font-size: 1rem;
        }

        .top-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-top {
            padding: 10px; border: 1px solid var(--neon-purple); background: rgba(188, 19, 254, 0.1);
            color: var(--neon-purple); border-radius: 8px; font-family: var(--font-header); font-size: 0.9rem; text-align: center;
        }

        /* LIST */
        .measure-list { display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
        .card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px; position: relative; backdrop-filter: blur(10px);
        }

        .status-tag {
            position: absolute; top: 15px; right: 15px; font-size: 0.7rem; 
            padding: 4px 8px; border-radius: 5px; font-weight: bold;
        }
        .tag-todo { color: var(--neon-orange); border: 1px solid var(--neon-orange); background: rgba(255,170,0,0.1); }
        .tag-done { color: var(--neon-cyan); border: 1px solid var(--neon-cyan); background: rgba(0,242,255,0.1); }

        .btn-call {
            background: #16a34a; color: #fff; text-decoration: none; padding: 12px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; margin: 15px 0; gap: 10px;
        }

        /* MODAL */
        .modal {
            display: none; position: fixed; inset: 0; background: #000;
            z-index: 1000; padding: 15px; overflow-y: auto;
        }
        .form-section { border-bottom: 1px solid var(--neon-purple); margin: 20px 0 10px 0; color: var(--neon-purple); padding-bottom: 5px; }
        .f-group { margin-bottom: 12px; }
        label { font-size: 0.65rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 3px; }
        input, select, textarea {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 12px; border-radius: 8px; color: #fff; width: 100%; font-family: var(--font-data);
        }

        .item-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(188, 19, 254, 0.3);
            padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative;
        }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-main { background: var(--neon-purple); color: #fff; padding: 15px; border: none; border-radius: 10px; font-family: var(--font-header); font-size: 1.3rem; width: 100%; margin-top: 20px; }

        .fab {
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
            background: var(--neon-purple); border-radius: 50%; border: none; font-size: 35px;
            color: white; box-shadow: 0 0 20px rgba(188, 19, 254, 0.5); z-index: 99;
        }

        /* REPORT TABLES (HIDDEN) */
        #schedule-report, #tech-sheet { position: fixed; left: -9999px; background: #fff; color: #000; padding: 30px; width: 800px; font-family: sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header style="margin-bottom: 15px;">
        <h1 style="font-size: 2rem;">PERGOLA <span style="color: var(--neon-purple);">MEASURE</span></h1>
        <div style="font-size: 0.7rem; opacity: 0.5; letter-spacing: 2px;">LOGISTIKA v1.9</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><span class="stat-val" id="stTotal">0</span><span class="stat-lbl">Ukupno</span></div>
        <div class="stat-card" style="border-color:var(--neon-orange)"><span class="stat-val" id="stTodo" style="color:var(--neon-orange)">0</span><span class="stat-lbl">Za merenje</span></div>
        <div class="stat-card" style="border-color:var(--neon-cyan)"><span class="stat-val" id="stDone" style="color:var(--neon-cyan)">0</span><span class="stat-lbl">Izmereno</span></div>
    </div>

    <div class="top-btns">
        <div class="btn-top" onclick="generateSchedule()">📸 PLAN OBILAZAKA</div>
        <div class="btn-top" onclick="exportBackup()">💾 BACKUP DATA</div>
    </div>

    <input type="text" class="search-box" id="search" placeholder="Pretraži (Ime ili Grad)..." oninput="render()">

    <div class="measure-list" id="measureList"></div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- MODAL -->
    <div id="measureModal" class="modal">
        <h2 style="color: var(--neon-purple); font-size: 1.8rem;">KLIJENT & TERMIN</h2>
        <input type="hidden" id="editId">
        
        <div class="f-group"><label>Ime i Prezime</label><input type="text" id="client"></div>
        <div class="grid2">
            <div class="f-group"><label>📍 Lokacija / Grad</label><input type="text" id="location"></div>
            <div class="f-group"><label>📞 Telefon</label><input type="tel" id="phone"></div>
        </div>
        <div class="f-group"><label>Datum Obilaska</label><input type="date" id="visitDate"></div>

        <h2 class="form-section">STAVKE ZA MERENJE</h2>
        <div id="itemsContainer"></div>
        <button class="btn-top" style="width:100%; margin-bottom:20px;" onclick="addItem()">+ DODAJ STAVKU (PERGOLA/STAKLO)</button>

        <h2 class="form-section">FINANSIJE & BELEŠKE</h2>
        <div class="grid2">
            <div class="f-group"><label>Ukupna Cena (€)</label><input type="number" id="totalPrice"></div>
            <div class="f-group"><label>Avans (€)</label><input type="number" id="deposit"></div>
        </div>
        <div class="f-group"><label>Napomena</label><textarea id="notes" rows="3"></textarea></div>

        <button class="btn-main" onclick="saveProject()">SAČUVAJ ZAPISNIK</button>
        <button class="btn-main" style="background:transparent; border:1px solid #333; color:grey; margin-top:10px;" onclick="closeModal()">ODUSTANI</button>
    </div>

    <!-- HIDDEN REPORT FOR IMAGE -->
    <div id="schedule-report">
        <h1 style="border-bottom: 2px solid #000; padding-bottom: 10px;">PLAN OBILAZAKA - ZA MERENJE</h1>
        <p id="repDate"></p>
        <table>
            <thead><tr><th>KLIJENT</th><th>LOKACIJA / GRAD</th><th>TELEFON</th><th>NAPOMENA</th></tr></thead>
            <tbody id="repContent"></tbody>
        </table>
    </div>

    <script>
        const STORAGE_KEY = 'pergola_master_measure';
        let projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

        function openModal(id = null) {
            const modal = document.getElementById('measureModal');
            document.getElementById('itemsContainer').innerHTML = '';
            if(id) {
                const p = projects.find(x => x.id === id);
                document.getElementById('editId').value = p.id;
                document.getElementById('client').value = p.client;
                document.getElementById('location').value = p.location;
                document.getElementById('phone').value = p.phone;
                document.getElementById('visitDate').value = p.visitDate || "";
                document.getElementById('totalPrice').value = p.totalPrice;
                document.getElementById('deposit').value = p.deposit;
                document.getElementById('notes').value = p.notes;
                p.items.forEach(item => addItem(item));
            } else {
                document.getElementById('editId').value = "";
                document.querySelectorAll('.modal input, .modal textarea').forEach(i => i.value = "");
                addItem(); 
            }
            modal.style.display = 'block';
        }

        function addItem(d = {}) {
            const div = document.createElement('div');
            div.className = 'item-box';
            div.innerHTML = `
                <span style="position:absolute;top:5px;right:10px;color:red;font-size:0.7rem;" onclick="this.parentElement.remove()">OBRIŠI X</span>
                <select class="i-type" style="margin-bottom:10px;" onchange="toggleP(this)">
                    <option value="Pergola" ${d.type==='Pergola'?'selected':''}>Pergola</option>
                    <option value="Staklo" ${d.type==='Staklo'?'selected':''}>Staklo</option>
                </select>
                <div class="grid2">
                    <div class="f-group"><label>Širina (cm)</label><input type="number" class="i-w" value="${d.w||''}"></div>
                    <div class="f-group"><label>Projekcija/Visina (cm)</label><input type="number" class="i-h" value="${d.h||''}"></div>
                </div>
                <div class="p-details" style="display:${d.type==='Staklo'?'none':'block'}">
                    <div class="grid2">
                        <div class="f-group"><label>V. Pozadi</label><input type="number" class="i-hr" value="${d.hr||''}"></div>
                        <div class="f-group"><label>V. Napred</label><input type="number" class="i-hf" value="${d.hf||''}"></div>
                        <div class="f-group"><label>Motor</label><select class="i-motor"><option ${d.motor==='Levo'?'selected':''}>Levo</option><option ${d.motor==='Desno'?'selected':''}>Desno</option></select></div>
                        <div class="f-group"><label>RAL</label><input type="text" class="i-ral" value="${d.ral||''}"></div>
                        <div class="f-group"><label>Platno</label><input type="text" class="i-fabric" value="${d.fabric||''}"></div>
                        <div class="f-group"><label>Svetlo</label><input type="text" class="i-light" value="${d.light||''}"></div>
                    </div>
                </div>
            `;
            document.getElementById('itemsContainer').appendChild(div);
        }

        function toggleP(s) { s.closest('.item-box').querySelector('.p-details').style.display = s.value==='Staklo'?'none':'block'; }

        function saveProject() {
            const id = document.getElementById('editId').value;
            let items = [];
            document.querySelectorAll('.item-box').forEach(box => {
                items.push({
                    type: box.querySelector('.i-type').value,
                    w: box.querySelector('.i-w').value, h: box.querySelector('.i-h').value,
                    hr: box.querySelector('.i-hr')?.value || "", hf: box.querySelector('.i-hf')?.value || "",
                    motor: box.querySelector('.i-motor')?.value || "Levo", ral: box.querySelector('.i-ral')?.value || "",
                    fabric: box.querySelector('.i-fabric')?.value || "", light: box.querySelector('.i-light')?.value || ""
                });
            });

            const data = {
                id: id ? parseInt(id) : Date.now(),
                client: document.getElementById('client').value,
                location: document.getElementById('location').value,
                phone: document.getElementById('phone').value,
                visitDate: document.getElementById('visitDate').value,
                totalPrice: document.getElementById('totalPrice').value,
                deposit: document.getElementById('deposit').value,
                notes: document.getElementById('notes').value,
                items: items
            };

            if(id) { projects[projects.findIndex(x => x.id == id)] = data; } 
            else { projects.push(data); }
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
            render();
            closeModal();
        }

        function render() {
            const list = document.getElementById('measureList');
            const search = document.getElementById('search').value.toLowerCase();
            list.innerHTML = '';

            const filtered = projects.filter(p => p.client.toLowerCase().includes(search) || p.location.toLowerCase().includes(search));
            
            filtered.reverse().forEach(p => {
                const isDone = p.items && p.items.some(i => i.w > 0);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="status-tag ${isDone ? 'tag-done' : 'tag-todo'}">${isDone ? 'Izmereno' : 'Za merenje'}</div>
                    <div style="font-size:1.6rem; color:#fff; font-family:'Bebas Neue'; padding-right:85px;">${p.client}</div>
                    <div style="font-size:0.85rem; opacity:0.7;">📍 ${p.location}</div>
                    <a href="tel:${p.phone}" class="btn-call">📞 POZOVI KLIJENTA</a>
                    <div style="font-size:0.8rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
                        ${p.items.map(i => `• ${i.type}: ${i.w || '?'} x ${i.h || '?'}`).join('<br>')}
                    </div>
                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button onclick="openModal(${p.id})" class="btn-top" style="flex:2; border-color:grey; color:#fff;">IZMENI / DETALJI</button>
                        <button onclick="deleteP(${p.id})" style="background:none; border:none; color:red; font-size:0.7rem;">OBRIŠI</button>
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('stTotal').innerText = projects.length;
            document.getElementById('stTodo').innerText = projects.filter(p => !p.items.some(i => i.w > 0)).length;
            document.getElementById('stDone').innerText = projects.filter(p => p.items.some(i => i.w > 0)).length;
        }

        async function generateSchedule() {
            const todo = projects.filter(p => !p.items.some(i => i.w > 0));
            if(todo.length === 0) { alert("Nema klijenata za merenje."); return; }
            
            document.getElementById('repDate').innerText = "DATUM: " + new Date().toLocaleDateString('sr-RS');
            const content = document.getElementById('repContent');
            content.innerHTML = '';
            todo.forEach(p => {
                content.innerHTML += `<tr><td><b>${p.client}</b></td><td>${p.location}</td><td>${p.phone}</td><td>${p.notes}</td></tr>`;
            });

            const canvas = await html2canvas(document.getElementById('schedule-report'));
            const link = document.createElement('a');
            link.download = `Plan_Merenja_${new Date().toLocaleDateString()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function deleteP(id) { if(confirm("Obriši?")) { projects = projects.filter(x => x.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); render(); } }
        function closeModal() { document.getElementById('measureModal').style.display = 'none'; }
        function exportBackup() {
            const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects));
            const a = document.createElement('a'); a.href = data; a.download = "backup_merenja.json"; a.click();
        }

        render();
    </script>
</body>
</html>
